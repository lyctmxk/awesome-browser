[project]
name = "awesome-browser"
version = "1.0.0"
description = "MCP server for browsing curated awesome lists + Hermes ecosystem (842 resources, 37 categories)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pyyaml",
]

[project.scripts]
awesome-browser = "awesome_browser.server:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
