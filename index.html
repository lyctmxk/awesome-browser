<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Awesome Browser — 精选资源 + Hermes 生态</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0d1117;
  --bg-card: #161b22;
  --bg-hover: #1c2333;
  --border: #30363d;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --accent: #58a6ff;
  --accent-dim: #1f6feb33;
  --green: #3fb950;
  --orange: #d2991d;
  --purple: #a371f7;
  --red: #f85149;
  --teal: #39d353;
  --radius: 8px;
  --sidebar-w: 280px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}
.sidebar-header h1 {
  font-size: 16px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}
.sidebar-header h1 .icon { font-size: 20px; }
.sidebar-stats {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* TABS in sidebar */
.sidebar-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
}
.sidebar-tab {
  flex: 1;
  text-align: center;
  padding: 10px 8px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  transition: all .15s;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
}
.sidebar-tab:hover { color: var(--text); background: var(--bg-hover); }
.sidebar-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}
.sidebar-nav::-webkit-scrollbar { width: 4px; }
.sidebar-nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.cat-link {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 16px;
  cursor: pointer;
  font-size: 12px;
  color: var(--text-muted);
  transition: all .15s;
  border-left: 3px solid transparent;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cat-link:hover { background: var(--bg-hover); color: var(--text); }
.cat-link.active { color: var(--accent); background: var(--accent-dim); border-left-color: var(--accent); }
.cat-link .count { margin-left: auto; font-size: 10px; color: var(--text-muted); background: var(--bg); padding: 1px 6px; border-radius: 10px; flex-shrink: 0; }

/* MAIN */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.top-bar {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-card);
}
.search-wrap {
  flex: 1;
  position: relative;
}
.search-wrap input {
  width: 100%;
  padding: 9px 14px 9px 38px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 13px;
  outline: none;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap .search-icon {
  position: absolute;
  left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 15px;
}
.result-count {
  font-size: 12px; color: var(--text-muted); white-space: nowrap;
}
.clear-btn {
  background: none; border: 1px solid var(--border);
  color: var(--text-muted); padding: 8px 14px;
  border-radius: var(--radius); cursor: pointer;
  font-size: 12px; display: none;
}
.clear-btn:hover { color: var(--text); border-color: var(--accent); }

.content {
  flex: 1; overflow-y: auto; padding: 20px 24px;
}
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* SECTION HEADERS */
.cat-section { margin-bottom: 28px; }
.cat-title {
  font-size: 19px; font-weight: 700; margin-bottom: 14px;
  padding-bottom: 8px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.cat-title .emoji { font-size: 22px; }
.subcat-title {
  font-size: 14px; font-weight: 600; color: var(--text-muted);
  margin: 14px 0 8px; padding-left: 4px;
}

/* GRID */
.items-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 8px;
}
.item-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  cursor: pointer;
  transition: all .15s;
  text-decoration: none;
  color: inherit;
  display: block;
}
.item-card:hover {
  background: var(--bg-hover);
  border-color: var(--accent);
  transform: translateY(-1px);
}
.item-card .item-header {
  display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
}
.item-card .item-name {
  font-weight: 600; font-size: 13px; color: var(--accent);
}
.item-card .item-tag {
  font-size: 10px; padding: 2px 7px; border-radius: 10px;
  font-weight: 600; text-transform: uppercase; flex-shrink: 0;
}
.tag-production { background: #1a3a1a; color: var(--green); }
.tag-beta { background: #2a2a10; color: var(--orange); }
.tag-experimental { background: #2a1020; color: var(--red); }
.item-card .item-author {
  font-size: 11px; color: var(--text-muted);
}
.item-card .item-author a { color: var(--purple); text-decoration: none; }
.item-card .item-author a:hover { text-decoration: underline; }
.item-card .item-desc {
  font-size: 11px; color: var(--text-muted); line-height: 1.45;
  margin-top: 4px;
}
.item-card .child-tag {
  display: inline-block;
  font-size: 10px; padding: 2px 8px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; color: var(--purple);
  text-decoration: none; margin: 3px 3px 0 0;
}
.item-card .child-tag:hover { background: var(--accent-dim); border-color: var(--purple); }
.item-card .github-link {
  float: right; font-size: 11px; color: var(--text-muted);
  opacity: 0; transition: opacity .15s;
}
.item-card:hover .github-link { opacity: 1; }
.item-card .no-link { color: var(--orange); }

.hidden { display: none !important; }
mark { background: var(--orange); color: #000; padding: 0 2px; border-radius: 3px; }

.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text-muted);
}
.empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
.empty-state h3 { font-size: 18px; margin-bottom: 6px; color: var(--text); }

.footer {
  text-align: center; padding: 16px;
  font-size: 11px; color: var(--text-muted);
  border-top: 1px solid var(--border);
}
.footer a { color: var(--accent); text-decoration: none; }

@media (max-width: 768px) {
  body { flex-direction: column; }
  .sidebar { width: 100%; height: auto; max-height: 35vh; border-right: none; border-bottom: 1px solid var(--border); }
  .items-grid { grid-template-columns: 1fr; }
  .content { padding: 14px; }
}

/* Changelog link */
.changelog-link {
  font-size: 10px; margin-top: 4px;
}
.changelog-link a { color: var(--text-muted); text-decoration: none; }
.changelog-link a:hover { color: var(--accent); }
</style>
</head>

d-only; optional Codex weekly auto-reset is **off by default** (consumes non-refundable reset credits when enabled) with a privacy-minimised JSONL audit. Prefer `hermes plugins install chenwei791129/hermes-usage-hook/plugin` over the remote `uv run` installer. MIT."}, {"name": "hermes-yandex-mail", "url": "https://github.com/akinfold/hermes-yandex-mail", "tag": "beta", "author": "akinfold", "author_url": "https://github.com/akinfold", "desc": "Yandex Mail over IMAP (no third-party proxy): list/search/read/flag/move/delete with app-password auth. Read-and-organise only (no SMTP send); `BODY.PEEK` so reads do not mark seen; `YANDEX_MAIL_ACTIONS` / `YANDEX_MAIL_FOLDERS` allowlists drop disallowed tools entirely. High-privilege mailbox access — scope the allowlist tightly. MIT, on PyPI."}, {"name": "hermes-yandex-disk", "url": "https://github.com/akinfold/hermes-yandex-disk", "tag": "beta", "author": "akinfold", "author_url": "https://github.com/akinfold", "desc": "Yandex Disk REST API v1 plugin: browse, read, download, write/upload, copy/move, share, and trash. Direct to `cloud-api.yandex.net`; action and path allowlists control what the agent may touch. High-privilege cloud storage — start read-only. MIT, on PyPI."}, {"name": "hermes-yandex-calendar", "url": "https://github.com/akinfold/hermes-yandex-calendar", "tag": "beta", "author": "akinfold", "author_url": "https://github.com/akinfold", "desc": "Yandex Calendar over CalDAV: list calendars/events, create/update, RSVP, move, delete. Preserves unmodeled iCalendar properties; `YANDEX_CALENDAR_ACTIONS` / `YANDEX_CALENDAR_CALENDARS` allowlists; untrusted server XML via defusedxml. High-privilege calendar write — prefer read-first. MIT, on PyPI."}, {"name": "hermes-yandex-search-api", "url": "https://github.com/akinfold/hermes-yandex-search-api", "tag": "beta", "author": "akinfold", "author_url": "https://github.com/akinfold", "desc": "Yandex Search API plugin: routes Hermes `web_search` to Yandex and adds a citation-backed generative search tool. Requires a paid Yandex Cloud API key + folder id. MIT, on PyPI."}, {"name": "hermes-plugin-slash-prompts", "url": "https://github.com/buihongduc132/hermes-plugin-slash-prompts", "tag": "beta", "author": "buihongduc132", "author_url": "https://github.com/buihongduc132", "desc": "Loads existing CLI-agent prompt files (OpenCode, Claude Code, Codex, Gemini CLI) as Hermes slash commands. Auto-discovers six standard prompt directories, reads YAML-frontmatter/TOML/raw formats, and unifies the different argument-interpolation syntaxes (`$ARGUMENTS`, `$1`–`$9`, `{{args}}`) in one handler. MIT."}, {"name": "cron-status-alert", "url": "https://github.com/pnascimento9596/cron-status-alert", "tag": "experimental", "author": "Paulo Nascimento", "author_url": "https://github.com/pnascimento9596", "desc": "Discord alert plugin for overdue Hermes cron jobs and failed deliveries, with recovery notifications and a `/cron-status` command. New and unadopted; MIT licensed."}, {"name": "hermes-gate", "url": "https://github.com/observer-protocol/hermes-gate", "tag": "experimental", "author": "Observer Protocol", "author_url": "https://github.com/observer-protocol", "desc": "Checks agent spending against signed delegation mandates before wallet actions. The current Hermes binding is bypassable by an agent that avoids the gate, and the repository does not declare a license."}, {"name": "hermes-delegation-gate", "url": "https://github.com/kenpritchard/hermes-delegation-gate", "tag": "experimental", "author": "Ken Pritchard", "author_url": "https://github.com/kenpritchard", "desc": "Adds human approval before `delegate_task` can spawn subagents, with a block mode for unattended runs. Requires a recent Hermes plugin-hook implementation; MIT licensed."}, {"name": "Extracto", "url": "https://github.com/rclarke87/Extracto", "tag": "experimental", "author": "Rutger Clarke", "author_url": "https://github.com/rclarke87", "desc": "Self-hosted web extraction plugin using local Trafilatura first and Jina Reader as a fallback for JavaScript-heavy pages. No API key is required; early first release."}, {"name": "RoBrain", "url": "https://github.com/adelinamart/robrain", "tag": "beta", "author": "adelinamart", "author_url": "https://github.com/adelinamart", "desc": "Self-hosted decision memory plugin that records rejected alternatives and resurfaces their reasons when an agent revisits them. Uses Postgres and can run with a local model; Apache-2.0."}, {"name": "hermes-agent-abacus-ai", "url": "https://github.com/ZoniBoy00/hermes-agent-abacus-ai", "tag": "experimental", "author": "ZoniBoy00", "author_url": "https://github.com/ZoniBoy00", "desc": "Image-generation plugin for Abacus.AI models. Requires an Abacus.AI API key; MIT licensed and still at its initial public revision."}, {"name": "agentiker plugin suite", "url": "https://github.com/IVRZ-da/agentiker-code-intel", "tag": "experimental", "author": "agentiker", "author_url": "https://github.com/IVRZ-da", "desc": "Three Hermes plugins for AST-aware code intelligence, repository scouting, and plan-following. The linked code-intel plugin is MIT licensed; each plugin installs separately."}, {"name": "hermes-doppler", "url": "https://github.com/inLeague/hermes-doppler", "tag": "experimental", "author": "inLeague", "author_url": "https://github.com/inLeague", "desc": "Doppler Secrets Manager plugin with per-profile secret isolation for multi-profile gateway deployments. Root config injects into `os.environ`; per-profile overlays stay scoped to the profile mechanism, with merge/overwrite modes. Fills the gap for teams on Doppler rather than the natively supported Bitwarden/1Password. MIT."}, {"name": "ClawRouter-Hermes", "url": "https://github.com/BlockRunAI/ClawRouter-Hermes", "tag": "beta", "author": "BlockRunAI", "author_url": "https://github.com/BlockRunAI", "desc": "Adds [ClawRouter](https://github.com/BlockRunAI/ClawRouter) as a native model provider: 55+ LLMs from 9 providers through one local proxy, paid per-call in USDC via x402 instead of per-provider API keys, with a model picker, routing profiles, and usage stats. Thin Python adapter over the canonical TypeScript proxy; on PyPI. It manages a real wallet (BIP-39, Base + Solana) and recommends a pipe-to-shell installer — review before running and fund only what you'd spend. MIT."}]}, {"name": "Skill Registries & Discovery", "items": [{"name": "hermeshub", "url": "https://github.com/amanning3390/hermeshub", "tag": "beta", "author": "amanning3390", "author_url": "https://github.com/amanning3390", "desc": "Browse, share, and install community skills for Hermes. Community hub for skill discovery, still early but growing."}, {"name": "skilldock.io", "url": "https://github.com/chigwell/skilldock.io", "tag": "production", "author": "chigwell", "author_url": "https://github.com/chigwell", "desc": "Registry of reusable AI skills compatible with OpenClaw, Claude Code, and Hermes. Established cross-platform skills marketplace with an active catalog."}, {"name": "Global Chat", "url": "https://global-chat.io", "tag": "production", "author": "pumanitro", "author_url": "https://github.com/pumanitro", "desc": "Cross-protocol agent discovery across MCP, A2A, and agents.txt. Searchable directory of 18K+ MCP servers and agents with a free agents.txt validator and MCP server for programmatic access."}, {"name": "BundleDex", "url": "https://bundledex.net", "tag": "beta", "author": "McClawdDigital", "author_url": "https://github.com/McClawdDigital", "desc": "Directory of OKF (Open Knowledge Format) knowledge bundles for agents, with MCP tools, `llms.txt`, and Hermes-oriented skills for search and submit ([bundledex-agent-skills](https://github.com/McClawdDigital/bundledex-agent-skills)). MIT skills; directory is hosted."}, {"name": "CreatorSkills", "url": "https://creatorskills.co", "tag": "production", "author": "CreatorSkills", "author_url": "https://github.com/calebvbi", "desc": "Curated marketplace of 30+ downloadable AI skills for content creators — YouTube scripting, sponsorship analysis, content repurposing, and audience growth. Uses the open SKILL.md format; skills install into Hermes, Claude Code, ChatGPT, and 20+ compatible platforms."}, {"name": "TypeUI for Hermes", "url": "https://www.typeui.sh/docs/guides/hermes", "tag": "production", "author": "Bergside", "author_url": "https://github.com/bergside/typeui", "desc": "Registry of design skills that give Hermes better context when building user interfaces. Component and style guidance sourced from an established design-system vendor. 1.4k+ stars."}]}]}, {"name": "Memory Providers", "subsections": [{"name": "", "items": [{"name": "hindsight", "url": "https://github.com/vectorize-io/hindsight", "tag": "production", "author": "Vectorize", "author_url": "https://github.com/vectorize-io", "desc": "Long-term memory layer for agents with retain/recall/reflect workflows. Integrates with Hermes via plugin or MCP and supports semantic, graph, and temporal retrieval."}, {"name": "honcho-self-hosted", "url": "https://github.com/elkimek/honcho-self-hosted", "tag": "beta", "author": "elkimek", "author_url": "https://github.com/elkimek", "desc": "Self-hosted Honcho memory backend setup for Hermes. Useful when you need stronger cross-session memory behavior with local control."}, {"name": "yantrikdb-hermes-plugin", "url": "https://github.com/yantrikos/yantrikdb-hermes-plugin", "tag": "beta", "author": "yantrikos", "author_url": "https://github.com/yantrikos", "desc": "Hermes-native memory provider for [YantrikDB](https://github.com/yantrikos/yantrikdb-server). Embedded by default like SQLite (`pip install yantrikdb`, no server or GPU), with an optional HTTP backend for clusters. Self-maintaining: `conflicts()` surfaces contradictions instead of overwriting silently, and every `recall()` result carries a `why_retrieved` reason list. Requires `yantrikdb>=0.10.0`."}, {"name": "flowstate-qmd", "url": "https://github.com/amanning3390/flowstate-qmd", "tag": "beta", "author": "amanning3390", "author_url": "https://github.com/amanning3390", "desc": "Anticipatory memory for AI agents with RAG and vector search. Pre-fetches relevant context before queries hit the agent."}, {"name": "Mnemosyne", "url": "https://github.com/AxDSan/Mnemosyne", "tag": "beta", "author": "AxDSan", "author_url": "https://github.com/AxDSan", "desc": "Local-first, sub-millisecond memory system built specifically for Hermes. SQLite + sqlite-vec hybrid search (50% vector / 30% FTS5 / 20% importance), BEAM tiered architecture (working / episodic / scratchpad), and a temporal knowledge graph (TripleStore) with time-aware fact invalidation. Native plugin (`hermes memory setup`, `hermes mnemosyne stats`), zero external dependencies, full docs at [docs.mnemosyne.site](https://docs.mnemosyne.site)."}, {"name": "mem0", "url": "https://github.com/mem0ai/mem0", "tag": "production", "author": "mem0ai", "author_url": "https://github.com/mem0ai", "desc": "Universal memory layer for AI agents. Multi-level memory (user, session, agent) with official Hermes integration."}, {"name": "honcho", "url": "https://github.com/plastic-labs/honcho", "tag": "beta", "author": "plastic-labs", "author_url": "https://github.com/plastic-labs", "desc": "Stateful memory library with asynchronous user-modeling reasoning. Builds richer user representations over time."}, {"name": "supermemory", "url": "https://github.com/supermemoryai/supermemory", "tag": "production", "author": "supermemoryai", "author_url": "https://github.com/supermemoryai", "desc": "Cloud and self-hosted memory layer. Single API for storing and querying agent memory."}, {"name": "hermes-lcm", "url": "https://github.com/stephenschoettler/hermes-lcm", "tag": "beta", "author": "stephenschoettler", "author_url": "https://github.com/stephenschoettler", "desc": "Lossless Context Management for Hermes — keeps session context from degrading in long runs."}, {"name": "ClawMem", "url": "https://github.com/yoloshii/ClawMem", "tag": "beta", "author": "yoloshii", "author_url": "https://github.com/yoloshii", "desc": "On-device memory layer for agents. Local-first with no external API dependencies."}, {"name": "gbrain", "url": "https://github.com/garrytan/gbrain", "tag": "beta", "author": "garrytan", "author_url": "https://github.com/garrytan", "desc": "Opinionated brain layer for Hermes. Structured personal memory with categorization and retrieval."}, {"name": "keepnotes", "url": "https://github.com/keepnotes-ai/keep", "tag": "beta", "author": "keepnotes-ai", "author_url": "https://github.com/keepnotes-ai", "desc": "Reflective memory layer. Stores and resurfaces notes at contextually relevant moments."}, {"name": "Brainstack", "url": "https://github.com/yepyhun/Brainstack", "tag": "beta", "author": "yepyhun", "author_url": "https://github.com/yepyhun", "desc": "Memory kernel stack for agents. Layered memory architecture with priority-based recall."}, {"name": "autocontext", "url": "https://github.com/greyhaven-ai/autocontext", "tag": "beta", "author": "greyhaven-ai", "author_url": "https://github.com/greyhaven-ai", "desc": "Recursive self-improving context harness. Automatically curates and compresses context to keep it relevant."}, {"name": "sourcevault-code-tools", "url": "https://github.com/sourcevault-ai/sourcevault-code-tools", "tag": "beta", "author": "sourcevault-ai", "author_url": "https://github.com/sourcevault-ai", "desc": "Private local code memory: semantic code search, exact file reads, and grounded repo Q&A with citations, all on-machine via a local SourceVault server. MIT."}, {"name": "hexus", "url": "https://github.com/codenamekt/hexus", "tag": "beta", "author": "codenamekt", "author_url": "https://github.com/codenamekt", "desc": "Postgres memory plugin and standalone MCP server. Local BERT (MiniLM-L6-v2) embeddings keep the memory hot path free of LLM and remote HTTP calls, with pgvector search, multi-agent storage, per-minion themes, and an async write queue. BSD-3-Clause."}, {"name": "hermes-penfield", "url": "https://github.com/penfieldlabs/hermes-penfield", "tag": "beta", "author": "penfieldlabs", "author_url": "https://github.com/penfieldlabs", "desc": "Memory provider for the Penfield knowledge graph — 16 tools, OAuth 2.1 device flow, stdlib-only, and the full MemoryProvider ABC (prefetch, pre-compress, system prompt block). Plugin is MIT, but it fronts the paid Penfield cloud service (no free tier)."}, {"name": "Tree Ring Memory", "url": "https://github.com/TerminallyLazy/tree-ring-memory-skill", "tag": "experimental", "author": "TerminallyLazy", "author_url": "https://github.com/TerminallyLazy", "desc": "Skill-level memory hygiene for local files: recall, capture, audit, consolidation, and intentional forgetting. Listed here as an approach rather than a drop-in Hermes memory provider."}]}]}, {"name": "Tools & Utilities", "subsections": [{"name": "", "items": [{"name": "hermes-workspace", "url": "https://github.com/outsourc-e/hermes-workspace", "tag": "production", "author": "outsourc-e", "author_url": "https://github.com/outsourc-e", "desc": "Web-based workspace with chat, terminal, memory browser, skills manager, and inspector. The most complete GUI for Hermes. Built during the Nous Hackathon 2026."}, {"name": "hermes-desktop", "url": "https://github.com/dodo-reach/hermes-desktop", "tag": "beta", "author": "dodo-reach", "author_url": "https://github.com/dodo-reach", "desc": "Native macOS workspace for Hermes built around a direct, host-first SSH connection model, with a real embedded terminal, session browsing, canonical file editing, skills browsing, and usage metrics without extra gateway or daemon layers."}, {"name": "mission-control", "url": "https://github.com/builderz-labs/mission-control", "tag": "production", "author": "builderz-labs", "author_url": "https://github.com/builderz-labs", "desc": "Open-source dashboard for AI agent orchestration. Manage agent fleets, dispatch tasks, track costs, and coordinate multi-agent workflows. Self-hosted, SQLite-powered. 5.7k+ stars."}, {"name": "hermes-neurovision", "url": "https://github.com/Tranquil-Flow/hermes-neurovision", "tag": "experimental", "author": "Tranquil-Flow", "author_url": "https://github.com/Tranquil-Flow", "desc": "Terminal neurovisualizer with 42 animated themes. Decorative terminal overlays for agent activity."}, {"name": "lintlang", "url": "https://github.com/roli-lpci/lintlang", "tag": "beta", "author": "roli-lpci", "author_url": "https://github.com/roli-lpci", "desc": "Static linter for AI agent configs and prompts with HERM v1.1 scoring. Catches config mistakes that silently degrade agent behavior."}, {"name": "nix-hermes-agent", "url": "https://github.com/0xrsydn/nix-hermes-agent", "tag": "beta", "author": "0xrsydn", "author_url": "https://github.com/0xrsydn", "desc": "Nix package and NixOS module for Hermes. Fully reproducible deployments via Nix flakes."}, {"name": "openclaw-to-hermes", "url": "https://github.com/0xNyk/openclaw-to-hermes", "tag": "beta", "author": "0xNyk", "author_url": "https://github.com/0xNyk", "desc": "Community migration tool from OpenClaw to Hermes. Built when the native `hermes-migrate` had critical bugs. For Hermes v0.3.0+, prefer the native `hermes claw migrate` command — it now covers the full migration path."}, {"name": "vessel-browser", "url": "https://github.com/unmodeled-tyler/vessel-browser", "tag": "experimental", "author": "unmodeled-tyler", "author_url": "https://github.com/unmodeled-tyler", "desc": "AI-native Linux browser with MCP control and autonomous browsing. Full browser built for agent use, not a headless wrapper."}, {"name": "camofox-browser", "url": "https://github.com/jo-inc/camofox-browser", "tag": "production", "author": "jo-inc", "author_url": "https://github.com/jo-inc", "desc": "Stealth headless browser server with REST API — bypasses Cloudflare, bot detection, and anti-scraping. Drop-in Puppeteer/Playwright replacement that powers Hermes's own browser automation. 7.7k+ stars, MIT, used in production by [askjo.ai](https://askjo.ai). The right backend if your VPS-hosted Hermes keeps getting blocked."}, {"name": "hermes-ui", "url": "https://github.com/pyrate-llama/hermes-ui", "tag": "beta", "author": "pyrate-llama", "author_url": "https://github.com/pyrate-llama", "desc": "Single-file glassmorphic web UI with SSE streaming, tool call visualization, activity panel, image analysis (Gemini Vision), session management, PDF export, skill browser, memory viewer, and mobile support. Python proxy server (stdlib only) on port 3333, no build step required."}, {"name": "hermes-webui", "url": "https://github.com/sanchomuzax/hermes-webui", "tag": "beta", "author": "sanchomuzax", "author_url": "https://github.com/sanchomuzax", "desc": "Lightweight process monitoring and configuration dashboard. Simpler alternative to hermes-workspace, focused on ops."}, {"name": "Hermes Studio", "url": "https://github.com/EKKOLearnAI/hermes-studio", "tag": "production", "author": "EKKOLearnAI", "author_url": "https://github.com/EKKOLearnAI", "desc": "Vue 3 + TypeScript dashboard for Hermes with Backend-for-Frontend separation. Real-time streaming chat across multiple backends (local/Docker/SSH/Singularity), unified config for 8 messaging channels, token/cost analytics with 30-day trends, cron job scheduling, multi-profile gateway management, multi-agent group chat with @mention routing, and a WebSocket-backed embedded terminal. 9.1k+ stars."}, {"name": "evey-setup", "url": "https://github.com/42-evey/evey-setup", "tag": "beta", "author": "42-evey", "author_url": "https://github.com/42-evey", "desc": "One-command setup for the full hermes-agent stack with free models and 29 plugins. Opinionated defaults that cover most use cases."}, {"name": "llmtrim", "url": "https://github.com/fkiene/llmtrim", "tag": "beta", "author": "fkiene", "author_url": "https://github.com/fkiene", "desc": "Local proxy in front of the model Hermes calls; compresses resent tool schemas, history, and MCP tool output before each request is sent. Quality-gated, so it never increases your bill. Also an MCP server, CLI, and library (Rust, Python, Ruby, Swift, Kotlin, JS/WASM). MPL-2.0. Same spirit as [rtk-hermes](https://github.com/ogallotti/rtk-hermes), but a transport-layer proxy rather than a native `pre_tool_call` plugin."}, {"name": "SkillClaw", "url": "https://github.com/AMAP-ML/SkillClaw", "tag": "production", "author": "AMAP-ML", "author_url": "https://github.com/AMAP-ML", "desc": "Open-source companion that auto-evolves, deduplicates, and improves your skill library from real session data. Adds a post-task evolution loop on top of Hermes's built-in skill creation. Native Hermes integration via `~/.hermes/skills`, safety flows (`skillclaw doctor hermes` / `skillclaw restore hermes`). Works across multiple devices and isolated skill silos. 705 stars, MIT licensed, active through 2026-04-17."}, {"name": "agenttrace", "url": "https://github.com/luoyuctl/agenttrace", "tag": "beta", "author": "luoyuctl", "author_url": "https://github.com/luoyuctl", "desc": "Local-first TUI/CLI for post-run agent session audits — cost/token spikes, tool failures, retry loops, latency gaps, health scores, anomalies, session-to-session diffs. No upload, no cloud, MIT. Companion SKILL.md (`agenttrace-session-audit`) packages the audit as an installable skill any host can run."}, {"name": "agentburn", "url": "https://github.com/Socialpranker/agentburn", "tag": "beta", "author": "Socialpranker", "author_url": "https://github.com/Socialpranker", "desc": "Local read-only profiler showing where a Hermes instance burns money. Splits spend by source (cron, gateways, subagents, CLI), walks message logs for re-read loops and retry patterns, and proposes paste-ready config fixes. Python stdlib only, `uvx agentburn`, MIT."}, {"name": "kesha-voice-kit", "url": "https://github.com/drakulavich/kesha-voice-kit", "tag": "beta", "author": "drakulavich", "author_url": "https://github.com/drakulavich", "desc": "Local-first CLI voice backend. STT in 25 languages and TTS via Hermes command providers with no API keys. Plugs into `HERMES_LOCAL_STT_COMMAND` and `tts.providers.<name>.type: command`."}, {"name": "xiaoma-hermes-zh-cn", "url": "https://github.com/fresh-claw/hermes-zh-cn", "tag": "production", "author": "fresh-claw", "author_url": "https://github.com/fresh-claw", "desc": "Chinese localization and onboarding package. One-command installer applies zh-CN UI text patches, gateway prompts, and pairing messages for Hermes 0.14.x/0.13.x."}, {"name": "Atlas Cloud", "url": "https://www.atlascloud.ai", "tag": "beta", "author": "Atlas Cloud", "author_url": "https://www.atlascloud.ai", "desc": "OpenAI-compatible API gateway for running Hermes workflows against multiple model families — useful for comparing skill behavior across providers without reworking integrations."}, {"name": "hermes-bus", "url": "https://github.com/mlinquan/hermes-bus", "tag": "beta", "author": "mlinquan", "author_url": "https://github.com/mlinquan", "desc": "Generic Unix socket message bus transport — 4-byte framing, endpoint registration, heartbeat keep-alive, auto-reconnect. Pairs with hermes-bus-plugin and hermes-notify."}, {"name": "hermes-notify", "url": "https://github.com/mlinquan/hermes-notify", "tag": "beta", "author": "mlinquan", "author_url": "https://github.com/mlinquan", "desc": "Config-driven notification router — YAML rule matching by message type, context injection, audio playback, and tmux notification sender."}, {"name": "arabic-agent-eval", "url": "https://github.com/Moshe-ship/arabic-agent-eval", "tag": "beta", "author": "Moshe-ship", "author_url": "https://github.com/Moshe-ship", "desc": "Dialect-split Arabic function-calling benchmark (51 items, 5 dialects) with public [leaderboard](https://huggingface.co/spaces/Mosescreates/arabic-agent-eval-leaderboard)."}, {"name": "hermes-plugin-guard", "url": "https://github.com/mauricemohr88-debug/hermes-plugin-guard", "tag": "experimental", "author": "mauricemohr88-debug", "author_url": "https://github.com/mauricemohr88-debug", "desc": "Local static scanner for Hermes plugins before you enable them — reviews manifests, Python capabilities, dependency declarations, likely committed secrets, and repo hygiene without ever importing or executing target code. Text, JSON, SARIF, or GitHub-annotation reports plus a reusable composite action for CI. A review aid, not a sandbox. MIT, tagged releases."}, {"name": "skillcraft", "url": "https://github.com/cloudroad-io/skillcraft", "tag": "beta", "author": "cloudroad-io", "author_url": "https://github.com/cloudroad-io", "desc": "Linter + sync CLI for agent-config files (`SKILL.md`, `CLAUDE.md`, `AGENTS.md`, `.cursor/rules`, `.claude/rules`, copilot-instructions). Pluggable rules, one `AGENTS.md` canonical source with drift checks, SARIF for CI. Vendor-neutral — works with Hermes and any agent that reads these files. Python, `pip install skillcraft`, MIT."}, {"name": "codex-stt-bridge", "url": "https://github.com/ai-babai/codex-stt-bridge", "tag": "experimental", "author": "ai-babai", "author_url": "https://github.com/ai-babai", "desc": "STT CLI that reuses a local Codex/ChatGPT OAuth session (file credential store) so Hermes can transcribe voice messages without an OpenAI Platform key or local Whisper. Uses an undocumented Codex Desktop transcription endpoint — experimental and may break; fails closed if auth is missing or too open. MIT."}]}, {"name": "Deployment", "items": [{"name": "hermes-agent-docker", "url": "https://github.com/xmbshwll/hermes-agent-docker", "tag": "beta", "author": "xmbshwll", "author_url": "https://github.com/xmbshwll", "desc": "Minimal Docker sandbox image for Hermes. Pull, run, done."}, {"name": "hermes-agent-template", "url": "https://github.com/Crustocean/hermes-agent-template", "tag": "beta", "author": "Crustocean", "author_url": "https://github.com/Crustocean", "desc": "Production-ready Docke tion. Wire it into Hermes via MCP to let the agent find and evaluate new tools to integrate on its own. Live at [nothumansearch.ai](https://nothumansearch.ai)."}, {"name": "NemoHermes", "url": "https://github.com/Hmbown/NemoHermes", "tag": "experimental", "author": "Hmbown", "author_url": "https://github.com/Hmbown", "desc": "NVIDIA capability registry and Spark-aware routing layer. Routes compute-heavy tasks to available GPU infrastructure."}, {"name": "microsoft-workspace-skill", "url": "https://github.com/Andrew-Girgis/microsoft-workspace-skill", "tag": "beta", "author": "Andrew-Girgis", "author_url": "https://github.com/Andrew-Girgis", "desc": "Full Outlook/Hotmail/Microsoft 365 integration via Microsoft Graph API. Email, calendar, contacts, user profile, and free/busy scheduling. OAuth2 with auto-refresh. Includes preview-before-send pattern that prevents shell `$` variable mangling — a real pain point when agents compose emails with dollar amounts."}, {"name": "agent-android", "url": "https://github.com/aivanelabs/ai-rpa/tree/main/skills/agent-android", "tag": "beta", "author": "AIVane Labs", "author_url": "https://github.com/aivanelabs", "desc": "LAN-first Android control for Hermes over WiFi — no USB, ADB, or root required once the AIVane service is running. Supports health checks, app listing/launching, UI tree inspection, taps, text input, swipes, navigation, screenshots, and inspect→act→smoke flows. Explicit safety boundaries: only connects to user-provided device URLs."}, {"name": "clawsocial-hermes-plugin", "url": "https://github.com/mrpeter2025/clawsocial-hermes-plugin", "tag": "beta", "author": "mrpeter2025", "author_url": "https://github.com/mrpeter2025", "desc": "Social discovery network plugin — helps users find and connect with people sharing their interests through their Hermes agent. Features semantic interest matching, real-time WebSocket messaging, shareable profile cards, local and web inbox, and 4 notification modes. All actions require explicit user request. Bilingual (English + Chinese), compatible with OpenClaw version."}, {"name": "mistral-mcp", "url": "https://github.com/Swih/mistral-mcp", "tag": "beta", "author": "Swih", "author_url": "https://github.com/Swih", "desc": "MCP server (stdio + Streamable HTTP) wrapping the full Mistral AI surface — chat, embeddings, vision, OCR, Voxtral audio (transcribe/speak), Codestral FIM, agents, moderation, classification, files, batch. 22 tools, 2 live resources, listed on the Official MCP Registry. Lets a Hermes user keep their primary reasoning model and route OCR / audio / FIM / classification to Mistral's specialized endpoints (free Experiment tier offers 1B tokens/month)."}, {"name": "Hermes Console", "url": "https://github.com/dannyshmueli/obsidian-hermes-console", "tag": "beta", "author": "dannyshmueli", "author_url": "https://github.com/dannyshmueli", "desc": "Obsidian integration for Hermes Agent. Runs Hermes in a tabbed terminal inside Obsidian and bridges selected-note/cursor context through a local companion plugin, with background status alerts when agent runs finish."}, {"name": "onequery-cli", "url": "https://github.com/wordbricks/skills/tree/main/skills/onequery-cli", "tag": "production", "author": "Wordbricks", "author_url": "https://github.com/wordbricks", "desc": "Governed read-only SQL access for agents. Routes through centralized credentials, source capability checks, query validation, row limits, and audit logs instead of direct database credentials. Apache-2.0."}, {"name": "agentchat-hermes", "url": "https://github.com/agentchatme/agentchat-hermes", "tag": "beta", "author": "agentchatme", "author_url": "https://github.com/agentchatme", "desc": "Connects Hermes to [AgentChat](https://agentchat.me) peer-to-peer agent messaging. WebSocket daemon with leader-lock singleton, 38 typed tools, and SOUL.md identity anchoring. Silence is a first-class outcome."}, {"name": "AgentChat Universal Skill", "url": "https://www.agentchat.me/hermes-skill.md", "tag": "beta", "author": "agentchatme", "author_url": "https://github.com/agentchatme", "desc": "Self-contained Markdown skill for autonomous AgentChat onboarding via `curl` and Hermes's `cronjob` tool — no human intervention needed."}, {"name": "windy-access", "url": "https://github.com/sneakyfree/windy-connect", "tag": "beta", "author": "sneakyfree", "author_url": "https://github.com/sneakyfree", "desc": "One-command pairing for the Windy ecosystem. Auto-detects runtime, configures `~/.hermes/.env`, and gives the agent a `@windymail.ai` mailbox, Matrix chat identity, and OpenAI-compatible LLM access. `windy disconnect --yes` reverses cleanly."}, {"name": "wasl", "url": "https://github.com/Moshe-ship/wasl", "tag": "beta", "author": "Moshe-ship", "author_url": "https://github.com/Moshe-ship", "desc": "Arabic MCP server — 30 tools (prayer times, Quran, Hijri dates, Arabic NLP). `pip install wasl-mcp`."}, {"name": "agy-cli bridge", "url": "https://github.com/ypnpt6ysmw-bit/agy-cli", "tag": "experimental", "author": "ypnpt6ysmw-bit", "author_url": "https://github.com/ypnpt6ysmw-bit", "desc": "Integrates Google Antigravity CLI and Antigravity Pro subscription credentials with Hermes via macOS Keychain OAuth — no AI Studio API keys needed."}, {"name": "Spraay x402 Gateway", "url": "https://gateway.spraay.app", "tag": "production", "author": "plagtech", "author_url": "https://github.com/plagtech", "desc": "Batch-pay recipients in a single on-chain transaction across 13+ chains. 151 paid primitives via x402 micropayment protocol. Available as [Hermes skill](https://github.com/NousResearch/hermes-agent/pull/49716) or [MCP server](https://smithery.ai/servers/Plagtech/Spraay-x402-mcp)."}, {"name": "hypernatt-terminal", "url": "https://github.com/DIALLOUBE-RESEARCH/hypernatt-terminal", "tag": "production", "author": "DIALLOUBE-RESEARCH", "author_url": "https://github.com/DIALLOUBE-RESEARCH", "desc": "[HyperNatt](https://hypernatt.com) BTC decision terminal MCP for agents ( const awesomeEmojis = {
  'Platforms':'🖥️','Programming Languages':'💻','Front-End Development':'🎨',
  'Back-End Development':'⚙️','Computer Science':'🧠','Big Data':'📊',
  'Theory':'📐','Books':'📚','Editors':'✏️','Gaming':'🎮',
  'Development Environment':'🛠️','Entertainment':'🎬','Databases':'🗄️',
  'Media':'📷','Learn':'🎓','Security':'🔒',
  'Content Management Systems':'📝','Hardware':'🔧','Business':'💼',
  'Work':'💪','Networking':'🌐','Decentralized Systems':'⛓️',
  'Health and Social Science':'🏥','Events':'📅','Testing':'🧪',
  'Miscellaneous':'📦','Related':'🔗'
};
const hermesEmojis = {
  'Official Resources':'🏛️','Skills & Plugins':'🧩','Memory Providers':'🧠',
  'Tools & Utilities':'🔧','Integrations & Bridges':'🔗',
  'Detection & Media Forensics':'🔍','Multi-Agent & Swarms':'🐝',
  'Domain Applications':'🏭','Forks & Derivatives':'🍴',
  'Guides & Documentation':'📖','Operational Playbooks':'📋','Level-Up Blueprints':'📈'
};

let currentSource = 'awesome';
let activeCategory = null;
let searchQuery = '';

// --- Render functions for Awesome Lists ---
function renderAwesome() {
  const content = document.getElementById('content');
  let html = '';
  let visibleCount = 0;
  const cats = activeCategory === null ? AWESOME_DATA.categories : [AWESOME_DATA.categories[activeCategory]];

  cats.forEach(cat => {
    const filtered = cat.items.filter(item => matchesSearchAwesome(item)).map(item => filterAwesomeItem(item));
    if (filtered.length === 0) return;
    const emoji = awesomeEmojis[cat.name] || '📌';
    html += `<section class="cat-section"><h2 class="cat-title"><span class="emoji">${emoji}</span>${cat.name}</h2><div class="items-grid">`;
    filtered.forEach(item => { html += renderAwesomeCard(item); visibleCount++; });
    html += '</div></section>';
  });

  if (visibleCount === 0) html = emptyState();
  content.innerHTML = html;
  document.getElementById('resultCount').textContent = searchQuery ? `找到 ${visibleCount} 个` : '';
}

function matchesSearchAwesome(item) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  const check = it => {
    if (it.name.toLowerCase().includes(q)) return true;
    if (it.desc && it.desc.toLowerCase().includes(q)) return true;
    if (it.children) return it.children.some(check);
    return false;
  };
  return check(item);
}

function filterAwesomeItem(item) {
  if (!searchQuery || !item.children || item.children.length === 0) return item;
  const q = searchQuery.toLowerCase();
  if (item.name.toLowerCase().includes(q) || (item.desc && item.desc.toLowerCase().includes(q))) return item;
  const filtered = {...item, children: item.children.filter(c =>
    c.name.toLowerCase().includes(q) || (c.desc && c.desc.toLowerCase().includes(q))
  )};
  return filtered.children.length > 0 ? filtered : item;
}

function renderAwesomeCard(item) {
  let html = '';
  const isParent = item.url !== null;
  const href = isParent ? ` href="${item.url}"` : '';
  const target = isParent ? ' target="_blank" rel="noopener"' : '';
  const nameClass = isParent ? 'item-name' : 'item-name no-link';
  html += `<a${href} class="item-card"${target}>`;
  html += `<div class="item-header"><span class="${nameClass}">${highlight(item.name)}</span>`;
  if (!isParent) html += '<span style="font-size:10px;opacity:.6">(分组)</span>';
  if (isParent) html += '<span class="github-link">↗</span>';
  html += '</div>';
  if (item.desc) html += `<div class="item-desc">${highlight(item.desc)}</div>`;
  if (item.children && item.children.length > 0) {
    html += '<div style="margin-top:6px">';
    item.children.forEach(c => {
      const ch = c.url ? `href="${c.url}" target="_blank" rel="noopener"` : '';
      html += `<a${ch} class="child-tag">${highlight(c.name)}</a>`;
    });
    html += '</div>';
  }
  html += '</a>';
  return html;
}

// --- Render functions for Hermes ---
function renderHermes() {
  const content = document.getElementById('content');
  let html = '';
  let visibleCount = 0;
  const cats = activeCategory === null ? HERMES_DATA.categories : [HERMES_DATA.categories[activeCategory]];

  cats.forEach(cat => {
    // Flatten all items across subsections and filter
    let allFiltered = [];
    cat.subsections.forEach(sub => {
      const filtered = sub.items.filter(item => matchesSearchHermes(item));
      if (filtered.length > 0) {
        allFiltered.push({ subname: sub.name, items: filtered });
      }
    });
    if (allFiltered.length === 0) return;

    const emoji = hermesEmojis[cat.name] || '📌';
    html += `<section class="cat-section"><h2 class="cat-title"><span class="emoji">${emoji}</span>${cat.name}</h2>`;

    allFiltered.forEach(group => {
      if (group.subname) html += `<h3 class="subcat-title">${group.subname}</h3>`;
      html += '<div class="items-grid">';
      group.items.forEach(item => {
        html += renderHermesCard(item);
        visibleCount++;
      });
      html += '</div>';
    });
    html += '</section>';
  });

  if (visibleCount === 0) html = emptyState();
  content.innerHTML = html;
  document.getElementById('resultCount').textContent = searchQuery ? `找到 ${visibleCount} 个` : '';
}

function matchesSearchHermes(item) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  return item.name.toLowerCase().includes(q) ||
         (item.desc && item.desc.toLowerCase().includes(q)) ||
         (item.author && item.author.toLowerCase().includes(q)) ||
         (item.tag && item.tag.toLowerCase().includes(q));
}

function renderHermesCard(item) {
  let tagHtml = '';
  if (item.tag) {
    const tagClass = item.tag === 'production' ? 'tag-production' : item.tag === 'beta' ? 'tag-beta' : 'tag-experimental';
    tagHtml = `<span class="item-tag ${tagClass}">${item.tag}</span>`;
  }
  let authorHtml = '';
  if (item.author) {
    if (item.author_url) {
      authorHtml = ` by <a href="${item.author_url}" target="_blank" onclick="event.stopPropagation()">${item.author}</a>`;
    } else {
      authorHtml = ` by ${item.author}`;
    }
  }

  return `<a href="${item.url}" class="item-card" target="_blank" rel="noopener">
    <div class="item-header">
      ${tagHtml}
      <span class="item-name">${highlight(item.name)}</span>
      <span class="github-link">↗</span>
    </div>
    <div class="item-author">${authorHtml}</div>
    ${item.desc ? `<div class="item-desc">${highlight(item.desc)}</div>` : ''}
  </a>`;
}

function highlight(text) {
  if (!searchQuery) return text;
  const escaped = searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(${escaped})`, 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

function emptyState() {
  return `<div class="empty-state"><div class="emoji">🔍</div><h3>没有找到匹配的结果</h3><p>试试其他关键词</p></div>`;
}

// --- Sidebar ---
function buildSidebar(source) {
  const nav = document.getElementById('sidebarNav');
  const data = source === 'awesome' ? AWESOME_DATA : HERMES_DATA;
  let html = `<div class="cat-link active" data-cat="all"><span>🏠</span> 全部</div>`;

  if (source === 'awesome') {
    data.categories.forEach((cat, i) => {
      const emoji = awesomeEmojis[cat.name] || '📌';
      const total = countAwesomeItems(cat);
      html += `<div class="cat-link" data-cat="${i}"><span>${emoji}</span> ${cat.name}<span class="count">${total}</span></div>`;
    });
  } else {
    data.categories.forEach((cat, i) => {
      if (cat.subsections.length === 0) return;
      const emoji = hermesEmojis[cat.name] || '📌';
      const total = cat.subsections.reduce((s, sub) => s + sub.items.length, 0);
      if (total === 0) return;
      html += `<div class="cat-link" data-cat="${i}"><span>${emoji}</span> ${cat.name}<span class="count">${total}</span></div>`;
    });
  }
  nav.innerHTML = html;
}

function countAwesomeItems(cat) {
  let n = cat.items.length;
  cat.items.forEach(item => { if (item.children) n += item.children.length; });
  return n;
}

// --- Events ---
document.querySelectorAll('.sidebar-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const source = tab.dataset.source;
    if (source === currentSource) return;
    currentSource = source;
    document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeCategory = null;
    searchQuery = '';
    document.getElementById('searchInput').value = '';
    document.getElementById('clearBtn').style.display = 'none';

    if (source === 'awesome') {
      document.getElementById('headerIcon').textContent = '😎';
      document.getElementById('headerTitle').textContent = 'Awesome Browser';
      document.getElementById('totalStats').textContent = `${AWESOME_DATA.categories.length} 类 · ${AWESOME_DATA.total_items} 列表`;
      document.getElementById('footer').innerHTML = '数据来源: <a href="https://github.com/sindresorhus/awesome" target="_blank">sindresorhus/awesome</a>';
      document.getElementById('changelog').style.display = 'none';
      document.getElementById('searchInput').placeholder = `搜索 ${AWESOME_DATA.total_items} 个精选列表...`;
      buildSidebar('awesome');
      renderAwesome();
    } else {
      document.getElementById('headerIcon').textContent = '🪽';
      document.getElementById('headerTitle').textContent = 'Hermes 生态';
      document.getElementById('totalStats').textContent = `${HERMES_DATA.categories.length} 类 · ${HERMES_DATA.total_items} 资源`;
      document.getElementById('footer').innerHTML = '数据来源: <a href="https://github.com/0xNyk/awesome-hermes-agent" target="_blank">0xNyk/awesome-hermes-agent</a>';
      document.getElementById('changelog').style.display = 'block';
      document.getElementById('searchInput').placeholder = `搜索 ${HERMES_DATA.total_items} 个 Hermes 资源...`;
      buildSidebar('hermes');
      renderHermes();
    }
  });
});

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  document.getElementById('clearBtn').style.display = searchQuery ? 'inline-block' : 'none';
  if (currentSource === 'awesome') renderAwesome();
  else renderHermes();
});

document.getElementById('sidebarNav').addEventListener('click', e => {
  const link = e.target.closest('.cat-link');
  if (!link) return;
  document.querySelectorAll('.cat-link').forEach(l => l.classList.remove('active'));
  link.classList.add('active');
  activeCategory = link.dataset.cat === 'all' ? null : parseInt(link.dataset.cat);
  if (currentSource === 'awesome') renderAwesome();
  else renderHermes();
  document.getElementById('content').scrollTop = 0;
});

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').style.display = 'none';
  searchQuery = '';
  if (currentSource === 'awesome') renderAwesome();
  else renderHermes();
}

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== document.getElementById('searchInput')) {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

// Init
buildSidebar('awesome');
renderAwesome();
document.getElementById('totalStats').textContent = `${AWESOME_DATA.categories.length} 类 · ${AWESOME_DATA.total_items} 列表`;
</script>
